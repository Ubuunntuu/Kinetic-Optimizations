plugins {
    id "java"
    id "net.fabricmc.fabric-loom-remap" version "1.18.4"
    id "ploceus" version "1.18.1"
}

version = "${project.mod_version}"
group = "${project.maven_group}"

base {
    archivesName = "${project.archives_base_name}"
}

repositories {
    maven {
        name = "Ornithe Releases"
        url = "https://maven.ornithemc.net/releases"
    }
    maven {
        name = "Ornithe Snapshots"
        url = "https://maven.ornithemc.net/snapshots"
    }
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    mavenCentral()
}

ploceus {
    setIntermediaryGeneration(2)
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings ploceus.featherMappings(project.feather_build)
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    ploceus.dependOsl(project.osl_version, "client")
}

processResources {
    inputs.property "version", project.version
    inputs.property "mc_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version

    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "mc_version": project.minecraft_version,
            "loader_version": project.loader_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
